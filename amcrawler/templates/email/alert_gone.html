<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f3f4f6;">
<div style="display:none;max-height:0;overflow:hidden;">{{ subject }}</div>
<div style="max-width:600px;margin:0 auto;padding:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#111827;">
  <div style="background-color:#ffffff;border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin:0 0 12px;">
    <h1 style="margin:0 0 10px;font-size:20px;line-height:1.3;font-weight:700;">{{ name }} non è più tra le partenze senza Coordinatore</h1>
    <div style="font-size:16px;line-height:1.5;margin:0;">Ha trovato un Coordinatore, è al completo oppure è stata annullata. Ultimo dato: {{ seats }} iscritti.</div>
    <a href="{{ url }}" style="display:block;box-sizing:border-box;margin:14px 0 0;padding:14px 16px;min-height:48px;background-color:#0b5fff;color:#ffffff;font-size:16px;font-weight:700;text-align:center;text-decoration:none;border-radius:8px;">Vedi viaggio</a>
  </div>
  <div style="padding:12px 4px;font-size:14px;line-height:1.5;color:#6b7280;">
    <a href="{{ public_url }}" style="color:#0b5fff;font-weight:700;">Apri AMCrawler</a>
  </div>
</div>
</body>
</html>
